          property: port
      - key: DB_USERNAME
        fromDatabase:
          name: ayni-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ayni-postgres
          property: password
      - key: DB_NAME
        fromDatabase:
          name: ayni-postgres
          property: database
      - key: JWT_SECRET
        sync: false

