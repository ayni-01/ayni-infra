databases:
  - name: ayni-postgres
    databaseName: somosayni
    user: somosayni
    plan: free          # cambiar a "starter" para producción (no expira)
    region: oregon

services:

  # ─────────────────────────────────────────
  # 1. identidad-service  (puerto 8081)
  #    ⚠️ Debe desplegarse PRIMERO — firma los JWT
  # ─────────────────────────────────────────
  - type: web
    name: ayni-identidad-service
    runtime: docker
    repo: https://github.com/ayni-01/ayni-identidad-service
    branch: main
    plan: free          # cambiar a "starter" para evitar cold starts
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: ayni-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ayni-postgres
          property: port
      - key: DB_USERNAME
        fromDatabase:
          name: ayni-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ayni-postgres
          property: password
      - key: DB_NAME
        fromDatabase:
          name: ayni-postgres
          property: database
      - key: JWT_SECRET
        sync: false     # ⚠️ Debes configurarlo manualmente en el dashboard de Render

  # ─────────────────────────────────────────
  # 2. perfiles-service  (puerto 8082)
